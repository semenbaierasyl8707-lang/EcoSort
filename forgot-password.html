<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | EcoSort AI</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .forgot-section {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            background: #f3faf5;
        }

        .forgot-card {
            width: 100%;
            max-width: 430px;
            padding: 45px 35px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(23,107,59,.10);
        }

        .forgot-card h1 {
            color: #176b3b;
            font-size: 32px;
            text-align: center;
            margin-bottom: 12px;
        }

        .forgot-description {
            color: #68776f;
            text-align: center;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .forgot-input label {
            display: block;
            color: #176b3b;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .forgot-input input {
            width: 100%;
            padding: 15px;
            border: 1px solid #dce9df;
            border-radius: 10px;
            outline: none;
            box-sizing: border-box;
            font-size: 14px;
        }

        .forgot-input input:focus {
            border-color: #159b50;
        }

        .forgot-button {
            width: 100%;
            padding: 15px;
            margin-top: 22px;
            border: none;
            border-radius: 10px;
            background: #159b50;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .forgot-button:hover {
            background: #10552f;
        }

        .forgot-message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 9px;
            background: #effaf3;
            color: #176b3b;
            text-align: center;
            font-size: 14px;
        }

        .back-login {
            text-align: center;
            margin-top: 25px;
        }

        .back-login a {
            color: #159b50;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>

<header class="site-header">
    <a class="brand" href="index.html">
        <span class="brand-mark">♻</span>
        <span>EcoSort <b>AI</b></span>
    </a>

    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="ecology.html">Ecology</a>
        <a href="services.html">Services</a>
        <a href="news.html">News</a>
        <a href="about.html">About Us</a>
        <a class="active" href="login.html">Login</a>
    </nav>

    <a class="header-link" href="scanner.html">Try scanner ↗</a>
</header>

<main>
    <section class="forgot-section">
        <div class="forgot-card">

            <h1>Forgot Password?</h1>

            <p class="forgot-description">
                Enter your email address to request a password reset.
            </p>

            <form id="forgotForm">
                <div class="forgot-input">
                    <label for="resetEmail">Email Address</label>
                    <input
                        type="email"
                        id="resetEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <button type="submit" class="forgot-button">
                    Reset Password
                </button>

                <div id="forgotMessage" class="forgot-message"></div>
            </form>

            <div class="back-login">
                <a href="login.html">← Back to Login</a>
            </div>

        </div>
    </section>
</main>

<footer class="site-footer">
    <a class="brand footer-brand" href="index.html">
        <span class="brand-mark">♻</span>
        <span>EcoSort <b>AI</b></span>
    </a>

    <p>Making waste sorting simpler, one scan at a time.</p>
    <small>© 2026 EcoSort AI.</small>
</footer>

<script src="script.js"></script>

<script type="module">
    import { auth } from "./firebase.js";

    import {
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const forgotForm = document.getElementById("forgotForm");
    const forgotMessage = document.getElementById("forgotMessage");

    forgotForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("resetEmail").value.trim();

        try {
            await sendPasswordResetEmail(auth, email);

            forgotMessage.textContent =
                "Password reset link has been sent to your email.";

            forgotMessage.style.color = "#20A464";

        } catch (error) {
            forgotMessage.textContent =
                "Unable to send reset email. Please check the email address.";

            forgotMessage.style.color = "red";
        }

        forgotMessage.style.display = "block";
    });
</script>

</body>
</html>
